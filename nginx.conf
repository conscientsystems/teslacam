worker_processes auto;
pid /var/run/nginx/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  access_log    off;
  server_tokens off;

  # WebCodecs and OffscreenCanvas need no cross-origin isolation here, but the
  # app decodes video the user chose from their own disk, so the usual
  # protections apply and nothing may frame it.
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Hashed assets are immutable; index.html must never be, or an installed
    # tab keeps loading last week's bundle.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
    }
  }
}
